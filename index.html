<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistem Akses</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container untuk login form */
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
        }

        /* Tab untuk user type */
        .tab-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #f0f0f0;
        }

        .tab-btn {
            flex: 1;
            padding: 14px 12px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 15px;
            font-weight: 600;
            color: #999;
            border-bottom: 3px solid transparent;
            transition: all 0.3s ease;
            position: relative;
        }

        .tab-btn.active {
            color: #667eea;
            border-bottom-color: #667eea;
        }

        .tab-btn:hover {
            color: #667eea;
        }

        /* Form group */
        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
            background: #f0f4ff;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        /* Tombol login */
        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Message */
        .message {
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }

        .message.error {
            background: #fee;
            color: #c33;
            display: block;
            border-left: 4px solid #c33;
        }

        .message.success {
            background: #efe;
            color: #3c3;
            display: block;
            border-left: 4px solid #3c3;
        }

        /* Remember me */
        .remember-me {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
            margin-top: 16px;
            gap: 8px;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .remember-me label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        /* Tab content */
        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
            animation: fadeIn 0.3s ease-in;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }

        /* Footer info */
        .footer-info {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .login-container {
                padding: 30px 20px;
                max-width: 90%;
                border-radius: 12px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-header .logo {
                font-size: 40px;
            }

            input[type="text"],
            input[type="password"] {
                padding: 12px 13px;
                font-size: 16px; /* Prevent zoom pada iOS */
            }
        }

        /* Loading indicator */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #667eea;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">🔐</div>
            <h1>Akses Sistem</h1>
            <p>Silakan login untuk melanjutkan</p>
        </div>

        <div class="tab-buttons">
            <button class="tab-btn active" onclick="switchTab('admin', event)">👨‍💼 Admin</button>
            <button class="tab-btn" onclick="switchTab('pegawai', event)">👤 Pegawai</button>
        </div>

        <div id="message" class="message"></div>

        <!-- Tab Admin -->
        <div id="admin-tab" class="tab-content active">
            <form onsubmit="handleLogin(event, 'admin')">
                <div class="form-group">
                    <label for="admin-username">Username</label>
                    <input type="text" id="admin-username" placeholder="Masukkan username admin" required>
                </div>
                <div class="form-group">
                    <label for="admin-password">Password</label>
                    <input type="password" id="admin-password" placeholder="Masukkan password" required>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="admin-remember">
                    <label for="admin-remember">Ingat saya</label>
                </div>
                <button type="submit" class="login-btn" id="admin-btn">
                    LOGIN
                </button>
            </form>
        </div>

        <!-- Tab Pegawai -->
        <div id="pegawai-tab" class="tab-content">
            <form onsubmit="handleLogin(event, 'pegawai')">
                <div class="form-group">
                    <label for="pegawai-username">Username</label>
                    <input type="text" id="pegawai-username" placeholder="Masukkan username" required>
                </div>
                <div class="form-group">
                    <label for="pegawai-password">Password</label>
                    <input type="password" id="pegawai-password" placeholder="Masukkan password" required>
                </div>
                <div class="remember-me">
                    <input type="checkbox" id="pegawai-remember">
                    <label for="pegawai-remember">Ingat saya</label>
                </div>
                <button type="submit" class="login-btn" id="pegawai-btn">
                    LOGIN
                </button>
            </form>
        </div>

        <div class="footer-info">
            Untuk pertanyaan, hubungi administrator
        </div>
    </div>

    <script>
        // ============================================
        // DATA USER - EDIT DI SINI UNTUK TAMBAH PEGAWAI
        // ============================================
        const users = {
            admin: [
                { username: 'admin', password: 'paus5308' }
            ],
            pegawai: [
                { username: 'budi', password: 'budi123' },
                { username: 'siti', password: 'siti123' },
                { username: 'rino', password: 'rino123' }
                // TAMBAHKAN PEGAWAI BARU DI SINI
                // { username: 'joko', password: 'joko123' },
                // { username: 'dewi', password: 'dewi123' },
            ]
        };

        // ============================================
        // HALAMAN TUJUAN SETELAH LOGIN
        // ============================================
        // Ganti URL dengan link Google Site Anda
        const redirectUrls = {
            admin: 'https://sites.google.com/view/e-officebpskabupatenlembata/beranda?authuser=0', // ← GANTI DENGAN GOOGLE SITE ADMIN
            pegawai: 'https://sites.google.com/view/e-officebpskabupatenlembata/beranda?authuser=0' // ← GANTI DENGAN GOOGLE SITE PEGAWAI
        };

        // ============================================
        // FUNCTIONS
        // ============================================

        // Switch Tab
        function switchTab(tab, event) {
            event.preventDefault();
            
            // Hide semua tab
            document.getElementById('admin-tab').classList.remove('active');
            document.getElementById('pegawai-tab').classList.remove('active');

            // Hapus active class dari semua button
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            // Show tab yang dipilih
            document.getElementById(tab + '-tab').classList.add('active');
            event.target.closest('.tab-btn').classList.add('active');

            // Clear message
            clearMessage();
        }

        // Handle Login
        function handleLogin(event, userType) {
            event.preventDefault();

            const username = document.getElementById(userType + '-username').value.trim();
            const password = document.getElementById(userType + '-password').value;
            const button = document.getElementById(userType + '-btn');
            const messageDiv = document.getElementById('message');

            // Disable button
            button.disabled = true;
            const originalText = button.textContent;
            button.innerHTML = 'LOADING<span class="loading"></span>';

            // Simulasi delay (untuk UX yang lebih baik)
            setTimeout(() => {
                // Cek kredensial
                const user = users[userType].find(u => u.username === username && u.password === password);

                if (user) {
                    showMessage('✓ Login berhasil! Mengalihkan...', 'success');
                    button.textContent = 'SUKSES ✓';

                    // Simpan ke localStorage jika "Ingat saya" dicek
                    if (document.getElementById(userType + '-remember').checked) {
                        localStorage.setItem('loggedInUser', JSON.stringify({
                            username: username,
                            userType: userType,
                            timestamp: new Date().getTime()
                        }));
                    }

                    // Redirect ke Google Site setelah 1.5 detik
                    setTimeout(() => {
                        window.location.href = redirectUrls[userType];
                    }, 1500);
                } else {
                    showMessage('✗ Username atau password salah!', 'error');
                    button.disabled = false;
                    button.textContent = originalText;
                }
            }, 800);
        }

        // Show Message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        // Clear Message
        function clearMessage() {
            document.getElementById('message').className = 'message';
            document.getElementById('message').textContent = '';
        }

        // Auto-login jika sudah tersimpan
        window.addEventListener('load', function() {
            const savedUser = localStorage.getItem('loggedInUser');
            if (savedUser) {
                const { username, userType } = JSON.parse(savedUser);
                // Isi username otomatis
                document.getElementById(userType + '-username').value = username;
                // Switch ke tab yang sesuai
                const tabBtn = document.querySelectorAll('.tab-btn')[userType === 'admin' ? 0 : 1];
                switchTab(userType, { target: tabBtn, preventDefault: () => {} });
            }
        });

        // Clear message saat user mulai input
        document.addEventListener('input', clearMessage);
    </script>
</body>
</html>
