<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login E-Office BPS Kabupaten Lembata</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3a8a 0%, #0369a1 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Container untuk login form */
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-header {
            text-align: center;
            margin-bottom: 35px;
        }

        .login-header .logo {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .login-header h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .login-header p {
            color: #888;
            font-size: 14px;
            line-height: 1.5;
        }

        /* Form group */
        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 13px 15px;
            border: 2px solid #e8e8e8;
            border-radius: 8px;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        input[type="text"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #0369a1;
            background: #f0f4ff;
            box-shadow: 0 0 0 3px rgba(3, 105, 161, 0.1);
        }

        /* Tombol login */
        .login-btn {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #1e3a8a 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
            box-shadow: 0 5px 15px rgba(3, 105, 161, 0.3);
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(3, 105, 161, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        /* Message */
        .message {
            text-align: center;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }

        .message.error {
            background: #fee;
            color: #c33;
            display: block;
            border-left: 4px solid #c33;
        }

        .message.success {
            background: #efe;
            color: #3c3;
            display: block;
            border-left: 4px solid #3c3;
        }

        /* Remember me */
        .remember-me {
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #666;
            margin-top: 16px;
            gap: 8px;
        }

        .remember-me input {
            width: 18px;
            height: 18px;
            cursor: pointer;
            accent-color: #0369a1;
        }

        .remember-me label {
            margin: 0;
            font-weight: normal;
            cursor: pointer;
        }

        /* Footer info */
        .footer-info {
            text-align: center;
            margin-top: 25px;
            padding-top: 20px;
            border-top: 1px solid #f0f0f0;
            font-size: 12px;
            color: #999;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .login-container {
                padding: 30px 20px;
                max-width: 90%;
                border-radius: 12px;
            }

            .login-header h1 {
                font-size: 24px;
            }

            .login-header .logo {
                font-size: 40px;
            }

            input[type="text"],
            input[type="password"] {
                padding: 12px 13px;
                font-size: 16px; /* Prevent zoom pada iOS */
            }
        }

        /* Loading indicator */
        .loading {
            display: inline-block;
            width: 12px;
            height: 12px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-left: 5px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <div class="logo">📊</div>
            <h1>Portal E-Office</h1>
            <p>Badan Pusat Statistik Kabupaten Lembata</p>
        </div>

        <div id="message" class="message"></div>

        <form onsubmit="handleLogin(event)">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required autofocus>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <div class="remember-me">
                <input type="checkbox" id="remember">
                <label for="remember">Ingat saya</label>
            </div>

            <button type="submit" class="login-btn" id="login-btn">
                MASUK KE E-OFFICE
            </button>
        </form>

        <div class="footer-info">
            E-Office BPS Kabupaten Lembata - 2024
        </div>
    </div>

    <script>
        // ============================================
        // DATA USER CREDENTIALS
        // ============================================
        const credentials = {
            username: '5308',
            password: 'paus5308'
        };

        // ============================================
        // URL TUJUAN SETELAH LOGIN
        // ============================================
        // Ganti dengan URL E-Office BPS Kabupaten Lembata Anda
        const eofficeURL = 'https://sites.google.com/view/e-officebps5308/beranda';

        // ============================================
        // HANDLE LOGIN
        // ============================================
        function handleLogin(event) {
            event.preventDefault();

            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const button = document.getElementById('login-btn');
            const messageDiv = document.getElementById('message');

            // Disable button
            button.disabled = true;
            const originalText = button.textContent;
            button.innerHTML = 'LOADING<span class="loading"></span>';

            // Simulasi delay untuk UX yang lebih baik
            setTimeout(() => {
                // Cek kredensial
                if (username === credentials.username && password === credentials.password) {
                    showMessage('✓ Login berhasil! Mengalihkan...', 'success');
                    button.textContent = 'SUKSES ✓';

                    // Simpan ke localStorage jika "Ingat saya" dicek
                    if (document.getElementById('remember').checked) {
                        localStorage.setItem('loggedInUser', JSON.stringify({
                            username: username,
                            timestamp: new Date().getTime()
                        }));
                    }

                    // Redirect ke E-Office setelah 1.5 detik
                    setTimeout(() => {
                        window.location.href = eofficeURL;
                    }, 1500);
                } else {
                    showMessage('✗ Username atau password salah!', 'error');
                    button.disabled = false;
                    button.textContent = originalText;
                }
            }, 800);
        }

        // Show Message
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
        }

        // Clear message saat user mulai input
        document.addEventListener('input', function() {
            document.getElementById('message').className = 'message';
            document.getElementById('message').textContent = '';
        });

        // Auto-fill username jika sudah tersimpan
        window.addEventListener('load', function() {
            const savedUser = localStorage.getItem('loggedInUser');
            if (savedUser) {
                const { username } = JSON.parse(savedUser);
                document.getElementById('username').value = username;
                document.getElementById('password').focus();
            }
        });
    </script>
</body>
</html>
